[workspace]
resolver = "2"
members = [
    "crates/ghostlight-core",
    "crates/ghostlight-parser",
    "crates/ghostlight-graph",
    "crates/ghostlight-analysis",
    "crates/ghostlight-execution",
    "crates/ghostlight-cli",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GHOSTLIGHT Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kai-Kodes/GhostLight"
rust-version = "1.85.0"

[workspace.dependencies]
ghostlight-core = { path = "crates/ghostlight-core" }
ghostlight-parser = { path = "crates/ghostlight-parser" }
ghostlight-graph = { path = "crates/ghostlight-graph" }
ghostlight-analysis = { path = "crates/ghostlight-analysis" }
ghostlight-execution = { path = "crates/ghostlight-execution" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = { version = "0.7", features = ["serde-1"] }
tree-sitter = "0.22.6"
tree-sitter-python = "0.21.0"
sha2 = "0.10"
walkdir = "2.5"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.17"
criterion = { version = "0.5", features = ["html_reports"] }
